<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1000" preserveAspectRatio="xMidYMid slice" width="1920" height="1000">
  <defs>
    <!-- soft blur for the wave bands -->
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="softer" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <!-- subtle paper grain -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.55  0 0 0 0 0.45  0 0 0 0 0.40  0 0 0 0.06 0"/>
    </filter>

    <radialGradient id="glowPeachTR" cx="85%" cy="18%" r="35%">
      <stop offset="0" stop-color="#F7D3BE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F7D3BE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPeachBL" cx="8%" cy="70%" r="40%">
      <stop offset="0" stop-color="#F5CDB8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#F5CDB8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerWash" cx="50%" cy="38%" r="38%">
      <stop offset="0" stop-color="#FFFCF8" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#FFFCF8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFFCF8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="blueBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9D6E3"/>
      <stop offset="0.5" stop-color="#DCE5EE"/>
      <stop offset="1" stop-color="#C7D4E2"/>
    </linearGradient>
    <linearGradient id="peachBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3C9B4"/>
      <stop offset="0.5" stop-color="#F9E3D6"/>
      <stop offset="1" stop-color="#F2CBB6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9B678" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#E9B678" stop-opacity="0.75"/>
      <stop offset="0.8" stop-color="#E9B678" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#E9B678" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1920" height="1000" fill="#FBF5EF"/>
  <rect width="1920" height="1000" fill="url(#glowPeachTR)"/>
  <rect width="1920" height="1000" fill="url(#glowPeachBL)"/>

  <!-- back layer: big diffuse shapes -->
  <g filter="url(#softer)" opacity="0.8">
    <path d="M-150 120 C 300 40, 560 220, 820 300 S 1300 260, 1480 140 S 1800 40, 2070 90 L2070 -150 L-150 -150 Z" fill="#D7E1EB"/>
    <ellipse cx="1650" cy="230" rx="320" ry="220" fill="#F4CDB8" opacity="0.7"/>
    <ellipse cx="160" cy="430" rx="360" ry="200" fill="#F2C7B2" opacity="0.6"/>
  </g>

  <!-- wave bands -->
  <g filter="url(#soft)">
    <!-- upper left blue sweep -->
    <path d="M-150 210 C 220 140, 420 200, 620 330 S 900 520, 1000 600 L -150 600 Z" fill="url(#blueBand)" opacity="0.75"/>
    <!-- upper right blue sweep -->
    <path d="M2070 300 C 1760 240, 1600 300, 1480 380 S 1260 520, 1180 620 L 2070 620 Z" fill="url(#blueBand)" opacity="0.7"/>

    <!-- peach bands left -->
    <path d="M-150 360 C 180 300, 380 330, 560 430 S 820 600, 900 700 L -150 700 Z" fill="url(#peachBand)" opacity="0.85"/>
    <!-- peach bands right -->
    <path d="M2070 420 C 1760 380, 1600 420, 1460 520 S 1240 680, 1160 760 L 2070 760 Z" fill="url(#peachBand)" opacity="0.8"/>

    <!-- lower blue band across -->
    <path d="M-150 640 C 300 560, 600 640, 900 700 S 1500 640, 2070 560 L 2070 1150 L -150 1150 Z" fill="url(#blueBand)" opacity="0.65"/>
    <!-- lower peach band across -->
    <path d="M-150 780 C 360 700, 700 820, 1000 840 S 1600 760, 2070 720 L 2070 1150 L -150 1150 Z" fill="url(#peachBand)" opacity="0.75"/>
    <!-- bottom blue -->
    <path d="M-150 900 C 400 840, 800 940, 1200 920 S 1700 860, 2070 880 L 2070 1150 L -150 1150 Z" fill="#D5DFE9" opacity="0.8"/>
  </g>

  <!-- white highlight ridges between bands -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" filter="url(#soft)" opacity="0.7">
    <path d="M-150 330 C 200 270, 400 300, 580 400 S 840 570, 940 660" stroke-width="22"/>
    <path d="M2070 390 C 1760 350, 1600 390, 1460 480 S 1240 640, 1150 730" stroke-width="22"/>
    <path d="M-150 740 C 340 660, 700 760, 1000 800 S 1600 720, 2070 680" stroke-width="18"/>
  </g>

  <!-- keep the centre calm for headline / content -->
  <rect width="1920" height="1000" fill="url(#centerWash)"/>

  <!-- thin gold accent lines -->
  <g fill="none" stroke="url(#gold)" stroke-width="1.6" stroke-linecap="round">
    <path d="M120 470 C 360 380, 620 360, 860 470"/>
    <path d="M1240 150 C 1420 230, 1560 360, 1700 400 S 1880 380, 2070 360"/>
    <path d="M1180 690 C 1380 600, 1600 560, 2070 640"/>
    <path d="M1560 820 C 1720 760, 1840 760, 2070 790"/>
  </g>

  <!-- speckles -->
  <g fill="#E9A98A" opacity="0.55">
    <circle cx="1520" cy="140" r="2.2"/><circle cx="1548" cy="172" r="1.4"/>
    <circle cx="1580" cy="128" r="1.8"/><circle cx="1610" cy="190" r="2.6"/>
    <circle cx="1640" cy="150" r="1.2"/><circle cx="1668" cy="210" r="1.9"/>
    <circle cx="1700" cy="170" r="1.4"/><circle cx="1735" cy="235" r="2.1"/>
    <circle cx="1760" cy="190" r="1.3"/><circle cx="1595" cy="240" r="1.5"/>
    <circle cx="760" cy="590" r="1.8"/><circle cx="790" cy="560" r="1.2"/>
    <circle cx="820" cy="610" r="2.3"/><circle cx="845" cy="575" r="1.4"/>
    <circle cx="870" cy="635" r="1.7"/><circle cx="740" cy="625" r="1.1"/>
    <circle cx="1880" cy="700" r="2"/><circle cx="1850" cy="740" r="1.3"/>
    <circle cx="1900" cy="760" r="1.6"/>
  </g>

  <!-- grain -->
  <rect width="1920" height="1000" filter="url(#grain)"/>
</svg>
