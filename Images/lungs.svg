<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="200" height="150" fill="#FFFFFF"/>
  <g transform="translate(100,75)">
    <!-- trachea -->
    <path d="M -3,-40 L -3,-8 M 3,-40 L 3,-8" stroke="#E8776B" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- left lung lobe -->
    <path d="M -3,-8
             C -6,-2 -14,-4 -20,-10
             C -34,-22 -42,-6 -42,14
             C -42,32 -34,44 -22,44
             C -12,44 -6,36 -4,26
             C -3,18 -3,-2 -3,-8 Z"
          fill="#F0A79C" stroke="#C15F52" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- right lung lobe -->
    <path d="M 3,-8
             C 6,-2 14,-4 20,-10
             C 34,-22 42,-6 42,14
             C 42,32 34,44 22,44
             C 12,44 6,36 4,26
             C 3,18 3,-2 3,-8 Z"
          fill="#F0A79C" stroke="#C15F52" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- bronchi branches, left -->
    <path d="M -3,-4 C -10,0 -16,2 -22,6 M -16,4 C -20,8 -24,10 -28,16 M -8,10 C -14,14 -18,18 -22,24 M -6,20 C -12,24 -16,28 -18,34"
          fill="none" stroke="#C15F52" stroke-width="1.6" stroke-linecap="round"/>
    <!-- bronchi branches, right -->
    <path d="M 3,-4 C 10,0 16,2 22,6 M 16,4 C 20,8 24,10 28,16 M 8,10 C 14,14 18,18 22,24 M 6,20 C 12,24 16,28 18,34"
          fill="none" stroke="#C15F52" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
