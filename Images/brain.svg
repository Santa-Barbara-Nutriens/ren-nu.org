<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="200" height="150" fill="#FFFFFF"/>
  <g transform="translate(100,75)">
    <!-- left hemisphere -->
    <path d="M -2,-34
             C -14,-38 -26,-34 -32,-24
             C -40,-22 -44,-14 -40,-6
             C -46,0 -44,10 -36,12
             C -38,20 -32,28 -22,28
             C -20,34 -12,38 -2,34 Z"
          fill="#C9A9D9" stroke="#8B5FA3" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- right hemisphere (mirrored) -->
    <path d="M 2,-34
             C 14,-38 26,-34 32,-24
             C 40,-22 44,-14 40,-6
             C 46,0 44,10 36,12
             C 38,20 32,28 22,28
             C 20,34 12,38 2,34 Z"
          fill="#C9A9D9" stroke="#8B5FA3" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- center divide -->
    <path d="M -2,-34 C 0,-20 0,10 -2,34 M 2,-34 C 0,-20 0,10 2,34"
          fill="none" stroke="#8B5FA3" stroke-width="2" stroke-linecap="round"/>
    <!-- gyri texture, left -->
    <path d="M -10,-26 C -16,-24 -14,-18 -20,-16
             M -8,-14 C -14,-12 -12,-6 -18,-4
             M -6,-2 C -12,0 -10,6 -16,8
             M -8,10 C -14,12 -12,18 -18,20
             M -22,-18 C -26,-14 -24,-8 -28,-4
             M -20,4 C -24,8 -22,14 -26,18"
          fill="none" stroke="#8B5FA3" stroke-width="1.4" stroke-linecap="round"/>
    <!-- gyri texture, right (mirrored) -->
    <path d="M 10,-26 C 16,-24 14,-18 20,-16
             M 8,-14 C 14,-12 12,-6 18,-4
             M 6,-2 C 12,0 10,6 16,8
             M 8,10 C 14,12 12,18 18,20
             M 22,-18 C 26,-14 24,-8 28,-4
             M 20,4 C 24,8 22,14 26,18"
          fill="none" stroke="#8B5FA3" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</svg>
